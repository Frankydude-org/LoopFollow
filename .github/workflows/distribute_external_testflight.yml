name: 5. Distribute LoopFollow to external TestFlight testers

# This local workflow is separate from the upstream LoopFollow build workflow.
# It only acts after a successful upload, and only once an external group exists.
on:
  workflow_run:
    workflows: ["4. Build LoopFollow"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopfollow-testflight-external-distribution
  cancel-in-progress: false

jobs:
  distribute:
    name: Distribute latest processed build to external group
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') &&
          vars.TESTFLIGHT_EXTERNAL_GROUP != '' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Fastlane
        run: bundle install

      - name: Prepare ephemeral App Store Connect API key
        env:
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          KEY_FILE: ${{ runner.temp }}/loopfollow-asc-api.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          required = ("FASTLANE_KEY_ID", "FASTLANE_ISSUER_ID", "FASTLANE_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing organization secrets: " + ", ".join(missing))
          with open(os.environ["KEY_FILE"], "w", encoding="utf-8") as f:
              json.dump({
                  "key_id": os.environ["FASTLANE_KEY_ID"],
                  "issuer_id": os.environ["FASTLANE_ISSUER_ID"],
                  "key": os.environ["FASTLANE_KEY"],
                  "in_house": False,
              }, f)
          os.chmod(os.environ["KEY_FILE"], 0o600)
          PY

      - name: Distribute previously uploaded build to Julie's group
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GROUP_NAME: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
          KEY_FILE: ${{ runner.temp }}/loopfollow-asc-api.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEAMID" || { echo "::error::TEAMID secret is missing"; exit 1; }
          test -n "$GROUP_NAME" || { echo "::error::External TestFlight group is missing"; exit 1; }
          # "pilot distribute" distributes an existing upload (no new IPA).
          # Waiting for processing is crucial because upstream uploads asynchronously.
          bundle exec fastlane pilot distribute \
            --api_key_path "$KEY_FILE" \
            --app_identifier "com.${TEAMID}.LoopFollow" \
            --groups "$GROUP_NAME" \
            --distribute_external true \
            --notify_external_testers true \
            --skip_waiting_for_build_processing false

      - name: Remove ephemeral key
        if: always()
        env:
          KEY_FILE: ${{ runner.temp }}/loopfollow-asc-api.json
        run: rm -f "$KEY_FILE"
